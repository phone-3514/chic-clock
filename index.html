<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Chic Clock</title>
<style>
  :root {
    --gold: #c9a24b;
    --gold-dim: #7a6636;
    --text: #e9e6dc;
    --text-dim: #8a877e;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* burn-in mitigation: whole block drifts a few px on a slow cycle */
  .drift {
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate3d(0, 0, 0);
    transition: transform 3s linear;
    padding: 4vh 6vw;
  }
  .frame {
    padding: 4vh 6vw;
    border: 1px solid rgba(201, 162, 75, 0.22);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  @media (orientation: landscape) {
    .frame { padding: 2vh 4vw; }
  }
  .stage.force-landscape .frame { padding: 4vw 2vh; }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--gold-dim);
    opacity: 0.6;
  }
  .frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .date {
    font-size: clamp(11px, 1.4vw, 18px);
    letter-spacing: 0.35em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 1.6vh;
    font-weight: 300;
  }

  .clock {
    display: flex;
    align-items: baseline;
    font-variant-numeric: tabular-nums;
    font-weight: 200;
    font-size: clamp(44px, 15vw, 160px);
    color: var(--text);
    letter-spacing: 0.02em;
  }
  /* In landscape there's ample width, so let the digits grow to fill
     the screen -- bounded by both axes so they never overflow. */
  @media (orientation: landscape) {
    .clock { font-size: clamp(50px, min(14vw, 34vh), 260px); }
  }
  .stage.force-landscape .clock {
    font-size: clamp(50px, min(14vh, 34vw), 260px);
  }
  .clock .sep {
    color: var(--gold);
    margin: 0 0.06em;
    font-weight: 200;
  }
  .clock .sep.dim { opacity: 0.18; }

  .weekday {
    margin-top: 2vh;
    font-size: clamp(10px, 1vw, 13px);
    letter-spacing: 0.5em;
    color: var(--gold-dim);
    text-transform: uppercase;
    font-weight: 300;
  }

  .hint {
    position: absolute;
    bottom: max(3vh, env(safe-area-inset-bottom));
    font-size: 11px;
    color: rgba(138, 135, 126, 0.3);
    letter-spacing: 0.1em;
    text-align: center;
    width: 100%;
  }
  @media (max-width: 480px) {
    .hint { display: none; }
  }

  /* Manual override: rotate the whole viewport content 90deg so a
     landscape layout can be forced while the phone is physically
     held in portrait. Toggled by the rotate button, not automatic. */
  .stage.force-landscape {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }

  .rotate-btn {
    position: fixed;
    top: max(2vh, env(safe-area-inset-top));
    right: max(3vw, env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(201, 162, 75, 0.3);
    background: rgba(255, 255, 255, 0.02);
    color: var(--gold);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  .rotate-btn.active {
    color: var(--text);
    border-color: rgba(201, 162, 75, 0.6);
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="drift" id="drift">
      <div class="frame">
        <div class="date" id="date"></div>
        <div class="clock">
          <span id="h">00</span><span class="sep" id="sep1">:</span><span id="m">00</span><span class="sep" id="sep2">:</span><span id="s">00</span>
        </div>
        <div class="weekday" id="weekday"></div>
      </div>
    </div>
    <div class="hint">タップで全画面 / F で12・24時間切替</div>
    <button class="rotate-btn" id="rotateBtn" aria-label="横向き表示に切替" title="横向き表示に切替">⟳</button>
  </div>

<script>
  const hEl = document.getElementById('h');
  const mEl = document.getElementById('m');
  const sEl = document.getElementById('s');
  const dateEl = document.getElementById('date');
  const weekdayEl = document.getElementById('weekday');
  const stage = document.getElementById('stage');
  const drift = document.getElementById('drift');
  const sep1 = document.getElementById('sep1');
  const sep2 = document.getElementById('sep2');

  let use24 = true;
  const weekdays = ['日','月','火','水','木','金','土'];

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  // Renders once per second only -- no per-frame work, no continuous
  // animation loop, so the CPU/GPU can stay idle between ticks.
  function render() {
    const now = new Date();
    let hours = now.getHours();
    let suffix = '';
    if (!use24) {
      suffix = hours >= 12 ? ' PM' : ' AM';
      hours = hours % 12;
      if (hours === 0) hours = 12;
    }
    hEl.textContent = pad(hours);
    mEl.textContent = pad(now.getMinutes());
    sEl.textContent = pad(now.getSeconds());

    const dim = now.getSeconds() % 2 === 1;
    sep1.classList.toggle('dim', dim);
    sep2.classList.toggle('dim', dim);

    const y = now.getFullYear();
    const mo = pad(now.getMonth() + 1);
    const d = pad(now.getDate());
    dateEl.textContent = `${y} . ${mo} . ${d}` + suffix;
    weekdayEl.textContent = weekdays[now.getDay()] + '曜日';
  }

  // Self-correcting scheduler: always aims at the next second boundary
  // instead of a fixed-period interval, so it never drifts and never
  // fires more often than needed.
  let tickTimer = null;
  function scheduleTick() {
    render();
    const now = Date.now();
    const delay = 1000 - (now % 1000) + 5;
    tickTimer = setTimeout(scheduleTick, delay);
  }

  function stopTicking() {
    if (tickTimer) clearTimeout(tickTimer);
    tickTimer = null;
  }

  // Pause all work while the screen/tab is hidden; resume instantly
  // (and re-sync) when it becomes visible again. This is the single
  // biggest battery win on mobile.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopTicking();
    } else {
      scheduleTick();
    }
  });

  scheduleTick();

  // Burn-in mitigation: nudge the whole clock a few pixels every
  // ~60s in a slow, unnoticeable pattern so no pixel stays lit at
  // full brightness indefinitely.
  const offsets = [
    [0, 0], [6, -4], [-5, 5], [4, 4], [-6, -3], [3, -6], [-3, 3]
  ];
  let offsetIndex = 0;
  setInterval(() => {
    if (document.hidden) return;
    offsetIndex = (offsetIndex + 1) % offsets.length;
    const [x, y] = offsets[offsetIndex];
    drift.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  }, 60000);

  stage.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      stage.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'f') {
      use24 = !use24;
      render();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Manual landscape override: rotates the content 90deg via CSS so it
  // reads sideways while the phone stays in portrait. Off by default --
  // the layout otherwise just follows however the device is actually
  // held (native rotation), portrait and landscape both stay available.
  const rotateBtn = document.getElementById('rotateBtn');
  const FORCE_KEY = 'chic-clock-force-landscape';

  function applyForceLandscape(on) {
    stage.classList.toggle('force-landscape', on);
    rotateBtn.classList.toggle('active', on);
  }

  applyForceLandscape(localStorage.getItem(FORCE_KEY) === '1');

  rotateBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const on = !stage.classList.contains('force-landscape');
    applyForceLandscape(on);
    localStorage.setItem(FORCE_KEY, on ? '1' : '0');
  });
</script>
</body>
</html>
